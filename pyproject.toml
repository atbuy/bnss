[project]
name = "bnss"
version = "1.0.8"
description = "Music bot for Discord written in Python"
authors = [{ name = "atbuy", email = "atbuy@atbuy.dev" }]
license = "MIT"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
  "discord.py[voice]==2.7.1",
  "pydantic-settings==2.16.1",
  "yt-dlp==2026.10.21",
]

[project.optional-dependencies]
dev = ["prek==0.5.7", "ruff==0.17.2"]

[tool.setuptools]
packages = ["bnss"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
