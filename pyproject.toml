[project]
name = "bnss"
version = "1.0.7"
description = "Music bot for Discord written in Python"
authors = [{ name = "atbuy", email = "atbuy@atbuy.dev" }]
license = "MIT"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
  "discord-py[voice]==2.7.1",
  "pydantic-settings==2.14.2",
  "yt-dlp==2026.7.4",
]

[project.optional-dependencies]
dev = ["pre-commit==4.6.0", "ruff==0.15.16"]

[tool.setuptools]
packages = ["bnss"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
