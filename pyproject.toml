[tool.poetry]
name = "bnss"
version = "1.0.3"
description = "Music bot for Discord written in Python"
authors = ["atbuy <atbuy@atbuy.dev>"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
discord-py = {version = "2.7.1", extras = ["voice"]}
pydantic-settings = "2.13.1"
yt-dlp = "2026.3.17"


[tool.poetry.group.dev.dependencies]
ruff = "0.15.9"
pre-commit = "4.5.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
